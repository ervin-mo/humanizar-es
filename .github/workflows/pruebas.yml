name: pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Sintaxis de los scripts de shell
        if: runner.os == 'Linux'
        run: for f in install.sh scripts/*.sh; do bash -n "$f"; done
      - name: shellcheck (solo errores)
        if: runner.os == 'Linux'
        run: shellcheck -S error install.sh scripts/*.sh
      - name: Pruebas
        run: python -m unittest discover -s tests -v
